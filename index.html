<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prestige Apparel Business Card</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="business-card">

        <div class="left-section">

            <div class="personal-info">
                <h1>Jade Angelo Adamos</h1>
                <p>Owner</p>
            </div>

            <div class="contact-info">

                <div class="contact-item">
                    <img src="telephone.png" alt="Phone" class="icon">
                    <span>+63 9465784372</span>
                </div>

                <div class="contact-item">
                    <img src="mail.png" alt="Email" class="icon">
                    <span>prestigeapparel@gmail.com</span>
                </div>

                <div class="contact-item">
                    <img src="location.png" alt="Location" class="icon">
                    <span>
                        Panikian, Banaybanay, Davao <br>
                        Oriental Philippines, 8208
                    </span>
                </div>

            </div>

        </div>

        <div class="curve"></div>

        <div class="right-section">

            <div class="logo">
                <img src="logo.png" alt="Prestige Apparel Logo">
            </div>

            <h2>Prestige Apparel</h2>

            <p>Be One Of Us</p>

        </div>

    </div>

    <div class="business-card back-card">

        <div class="logo">
            <img src="logo.png" alt="Prestige Apparel Logo">
        </div>

        <h2>Prestige Apparel</h2>

        <p>Be One Of Us</p>

    </div>

</body>
<html>
